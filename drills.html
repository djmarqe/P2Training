<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P2 Fresh Drills</title>
<meta name="theme-color" content="#EFF1F3">
<style>
/* layout: one narrow column like the P2 trainer: figure, question, four answers, explanation.
   The question generators and the figure styles live in drills.js. */
:root{--paper:#EFF1F3;--card:#FFFFFF;--ink:#14191F;--muted:#5C6672;--line:#D7DCE1;--blue:#17457A;--on-blue:#FFFFFF;--metal:#C9D0D8;--ok:#1E6B3A;--ok-bg:#E3F3E8;--no:#A12B2B;--no-bg:#FBE6E6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12161B;--card:#1B2129;--ink:#E8ECF0;--muted:#9AA5B1;--line:#2E3742;--blue:#7FB0EA;--on-blue:#0B1622;--metal:#4A5562;--ok:#7AD49A;--ok-bg:#16301F;--no:#F09A9A;--no-bg:#3A1B1B;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12161B;--card:#1B2129;--ink:#E8ECF0;--muted:#9AA5B1;--line:#2E3742;--blue:#7FB0EA;--on-blue:#0B1622;--metal:#4A5562;--ok:#7AD49A;--ok-bg:#16301F;--no:#F09A9A;--no-bg:#3A1B1B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
ul{margin:0;padding-left:20px}
.back{color:var(--blue);font-weight:600;font-size:14.5px;text-decoration:none}
.sub,.note{color:var(--muted);font-size:14px}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mode,.opt{display:flex;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.mode{flex-direction:column;gap:2px}
.mode span{color:var(--muted);font-size:13.5px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{gap:12px;align-items:flex-start;min-height:48px}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.ltr{font-weight:700;color:var(--blue)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-size:17px;font-weight:600}
.fb{border-radius:10px;padding:12px 14px;font-size:14.5px;background:var(--ok-bg)}
.fb b{display:block;color:var(--ok)}
.fb.no{background:var(--no-bg)}
.fb.no b{color:var(--no)}
.go{background:var(--blue);color:var(--on-blue);border:0;border-radius:10px;padding:14px;font-weight:700}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--blue);font-weight:600}
.score{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
</style>

<div id="app"></div>

<script src="drills.js"></script>
<script>
/* ---------- screens ---------- */
try{document.documentElement.dataset.theme=localStorage.getItem("asep2:theme")==="light"?"light":"dark"}catch(e){}   // same night-mode setting as the trainer
{
  const SETS=DRILLS.SETS,shuffle=DRILLS.shuffle;
  const app=document.getElementById("app");let run=null;
  const home=()=>{app.innerHTML=`<a class="back" href="index.html">← Back to the trainer</a><h1>P2 Fresh Drills</h1>
    <p class="sub">New numbers, new drawings and a new answer order every time, so you can't answer from memory. These cover the two things a fixed question bank can't: picture questions and no-calculator math.</p>
    <button class="mode" data-a="pic"><b>Picture ID</b><span>10 drawings: bolt heads, micrometer, flares, lug seats, alignment, bulbs, belts, VIN</span></button>
    <button class="mode" data-a="math"><b>Math, no calculator</b><span>10 problems: margin and markup, stacked discounts, cost per month, decimals, thread callouts</span></button>
    <button class="mode" data-a="mix"><b>Mixed 15</b><span>Both kinds, timed against the test pace of about 63 seconds a question</span></button>
    <p class="note">Work the math on paper. No calculator is allowed in the test room.</p>
    <p class="note">Practice material written against the published ASE P2 task list. These are not actual test items and no affiliation with ASE is implied.</p>`;};
  const start=kind=>{const n=kind=="mix"?15:10,qs=[];let pool=[];while(qs.length<n){if(!pool.length)pool=shuffle(SETS[kind].slice());qs.push(pool.pop()());}run={kind,qs,i:0,right:0,missed:[],t0:Date.now()};show();};
  const show=()=>{const q=run.qs[run.i];app.innerHTML=`<div class="meta"><span>${run.i+1} of ${run.qs.length} · ${q.t}</span><span>${run.right} right</span></div>
    ${q.svg?`<div class="fig">${q.svg}</div>`:""}<p class="q">${q.q}</p>
    <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-a="ans" data-j="${j}"><span class="ltr">${"ABCD"[j]}</span><span>${o}</span></button>`).join("")}</div><div id="fb"></div>`;window.scrollTo(0,0);};
  const answer=j=>{const q=run.qs[run.i],ok=j==q.c;if(ok)run.right++;else run.missed.push(q.t);
    app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k==q.c)b.classList.add("right");else if(k==j)b.classList.add("wrong");});
    document.getElementById("fb").innerHTML=`<div class="fb${ok?"":" no"}"><b>${ok?"Correct":"Correct answer: "+"ABCD"[q.c]}</b>${q.e}</div>`;
    app.insertAdjacentHTML("beforeend",`<button class="go" data-a="next">${run.i+1==run.qs.length?"See results":"Next question"}</button>`);};
  const done=()=>{const n=run.qs.length,s=Math.round((Date.now()-run.t0)/1000/n),m={};run.missed.forEach(t=>m[t]=(m[t]||0)+1);
    app.innerHTML=`<h1>Results</h1><p class="score">${run.right} / ${n}</p>
    <p class="sub">${s} seconds per question, including reading the explanations. The test allows about 63.</p>
    ${run.missed.length?`<p><b>Missed</b></p><ul>${Object.keys(m).map(t=>`<li>${t}${m[t]>1?" × "+m[t]:""}</li>`).join("")}</ul>`:`<p>Nothing missed. Run it again, the questions will be different.</p>`}
    <button class="go" data-a="${run.kind}">Go again with new questions</button><button class="ghost" data-a="home">Back to start</button>`;window.scrollTo(0,0);};
  app.addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;const a=b.dataset.a;
    if(a=="home")home();else if(a=="ans")answer(+b.dataset.j);else if(a=="next"){run.i++;run.i<run.qs.length?show():done();}else start(a);});
  home();
}
</script>
