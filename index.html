{a:"C",t:"Ignition",q:"The job of an ignition coil is to:",o:["step battery voltage up to the thousands of volts needed to fire the plug","store current for the starter","time the spark to the crankshaft","suppress radio interference"],c:0,e:"The coil is a transformer that turns 12 volts into the high voltage needed to jump the plug gap. Timing comes from the computer and the crankshaft position sensor."},
{a:"C",t:"Ignition",q:"A failed crankshaft position sensor will MOST likely cause:",o:["a no-start or a stall","a slow power window","a low coolant warning","a soft brake pedal"],c:0,e:"The computer uses the crankshaft position signal to time both spark and fuel injection. With no signal, the engine cranks but will not run."},
{a:"C",t:"Emissions",q:"A secondary air injection system:",o:["pumps fresh air into the exhaust to help burn hydrocarbons and carbon monoxide","routes exhaust gas back into the intake","stores fuel vapor from the tank","vents crankcase blow-by to the intake"],c:0,e:"Air injection adds oxygen to the exhaust, mostly during warm-up, to oxidize HC and CO. Routing exhaust to the intake is EGR, storing vapor is EVAP and venting blow-by is PCV."},
{a:"C",t:"Emissions",q:"The underhood emissions label (VECI label) tells the parts specialist:",o:["which emissions equipment the vehicle has and whether it is federal or California certified","the paint code and trim code","the tire size and inflation pressure","the transmission fluid type"],c:0,e:"The vehicle emission control information label lists the emissions systems and certification, and often a vacuum hose diagram. It settles catalog listings that split federal and California emissions."},
{a:"C",t:"Brakes",q:"The component that uses engine vacuum to multiply the force applied to the brake pedal is the:",o:["brake booster","proportioning valve","master cylinder reservoir","wheel cylinder"],c:0,e:"The vacuum booster sits between the pedal and the master cylinder. A hard pedal with poor stopping points to the booster or its vacuum hose and check valve."},
{a:"C",t:"Brakes",q:"A brake rotor's minimum thickness specification is found:",o:["cast or stamped on the rotor itself","on the brake pad box","on the tire sidewall","on the VIN plate"],c:0,e:"The discard thickness is marked on the rotor and listed in service data. A rotor at or below it has to be replaced, not machined."},
{a:"C",t:"Brakes",q:"All of these come in a typical drum brake hardware kit EXCEPT:",o:["return springs","hold-down springs and pins","caliper slide pins","the adjuster spring"],c:2,e:"Caliper slide pins are disc brake parts. A drum hardware kit has the return springs, hold-down springs, pins and cups, and the adjuster spring."},
{a:"C",t:"Brakes",q:"Specialist A says DOT 5.1 brake fluid is silicone-based, like DOT 5. Specialist B says DOT 5.1 is glycol-based and compatible with DOT 3 and DOT 4. Who is right?",o:["A only","B only","Both A and B","Neither A nor B"],c:1,e:"B is right. Despite the number, DOT 5.1 is a glycol fluid that mixes with DOT 3 and DOT 4. Only DOT 5 is silicone, and it does not mix with the others."},
{a:"C",t:"Belts and hose",q:"Modern EPDM serpentine belts are checked for wear by:",o:["measuring rib material loss with a belt wear gauge","counting cracks across the ribs","checking the color of the back of the belt","smelling the belt for burned rubber"],c:0,e:"EPDM belts rarely crack. They wear like a tire, losing rib material until the belt rides low in the pulleys and slips. A wear gauge shows it."},
{a:"C",t:"Belts and hose",q:"On a high-mileage vehicle, the MOST appropriate related sale with a serpentine belt is:",o:["the automatic belt tensioner and idler pulleys","a new crankshaft","a thermostat","spark plug wires"],c:0,e:"The tensioner spring and the pulley bearings wear with the belt. A weak tensioner lets a new belt slip and squeal."},
{a:"C",t:"Belts and hose",q:"A molded radiator hose is preferred over a universal flex hose because it:",o:["matches the original bends and will not kink or rub","holds more coolant","needs no clamps","is rated for fuel as well as coolant"],c:0,e:"A molded hose follows the original routing. A flex hose is a temporary fit that can kink, rub on other parts or restrict flow."},
{a:"C",t:"Belts and hose",q:"Vehicle manufacturers use constant-tension spring clamps on coolant hoses because they:",o:["keep clamping force as the hose expands and shrinks with temperature","are easier to remove than screw clamps","can be reused on fuel-injection hose","seal without touching the hose"],c:0,e:"Rubber hose takes a set and shrinks as it cools. A spring clamp follows it and keeps sealing, where a screw clamp can loosen and seep when cold."},
{a:"C",t:"Body and refinish",q:"Which of these sandpaper grits is the finest?",o:["1500","400","180","80"],c:0,e:"The higher the grit number, the finer the paper. 80 grit shapes filler, 180 to 400 feathers and preps for primer, and 1500 is for wet sanding clear coat."},
{a:"C",t:"Body and refinish",q:"Over bare metal, refinish products are applied in which order?",o:["primer, base coat, clear coat","clear coat, base coat, primer","base coat, primer, clear coat","primer, clear coat, base coat"],c:0,e:"Primer bonds to the metal and fills, the base coat supplies the color and the clear coat gives gloss and protection."},
{a:"C",t:"Body and refinish",q:"A customer spraying catalyzed (two-part) paint should be told they need:",o:["the approved respirator named on the product's safety data sheet","a paper dust mask","safety glasses only","no protection if the garage door is open"],c:0,e:"Hardeners for two-part paints contain isocyanates, which are a serious breathing hazard. A dust mask does nothing against vapors. The SDS names the protection required."},
{a:"C",t:"Fittings",q:"AN and JIC fittings seal on a flare with an angle of:",o:["37 degrees","45 degrees","60 degrees","90 degrees"],c:0,e:"AN and JIC fittings use a 37 degree flare. SAE automotive flares are 45 degrees. The two do not interchange, even when the threads start."},
{a:"C",t:"Fittings",q:"On an inverted flare brake line fitting, thread sealant or tape should be applied:",o:["nowhere, because the fitting seals on the flare","to the flare seat","to the threads only","to both the threads and the seat"],c:0,e:"Flare fittings seal metal to metal on the flare. Sealant is not needed, and bits of it can get into the brake system. Sealant belongs on tapered pipe threads such as NPT."},
{a:"C",t:"Fittings",q:"A male 1/4-inch NPT fitting measures about 0.54 inch across its threads because:",o:["NPT sizes are nominal pipe sizes, not the measured thread diameter","it is mislabeled","NPT threads are measured in millimeters","the taper doubles the size"],c:0,e:"Pipe thread sizes are nominal and come from the pipe's bore, so the threads always measure larger than the name. Use a thread chart or gauge to identify them."},
{a:"C",t:"Accessories",q:"A customer wants a thread-locking compound for a bolt that must still come out with ordinary hand tools. The specialist should supply:",o:["medium-strength (blue) thread locker","high-strength (red) thread locker","RTV silicone","anti-seize compound"],c:0,e:"Blue is medium strength and removable with hand tools. Red is high strength and usually needs heat to break loose. Anti-seize does the opposite job."},
{a:"C",t:"Accessories",q:"RTV silicone used on an engine with oxygen sensors must be labeled:",o:["sensor-safe","high-strength","fuel-proof","conductive"],c:0,e:"Ordinary silicone gives off vapors that can contaminate oxygen sensors. Sensor-safe RTV is made for computer-controlled engines."},
{a:"C",t:"Accessories",q:"A trailer hitch ball is selected by its:",o:["ball diameter, shank size and weight rating","color and finish","thread pitch alone","height above the ground"],c:0,e:"The ball diameter must match the trailer coupler, commonly 1-7/8, 2 or 2-5/16 inch. The shank must fit the ball mount, and the weight rating must cover the trailer."},
{a:"C",t:"Accessories",q:"The correct grease for the wheel bearings on a vehicle with disc brakes is:",o:["high-temperature wheel bearing grease rated NLGI GC-LB","white lithium spray grease","dielectric grease","any general-purpose chassis grease"],c:0,e:"Disc brakes put a lot of heat into the hub. GC is the NLGI rating for wheel bearing service and LB is for chassis lubrication, so GC-LB grease covers both."}
];
const AREA={A:{n:"General operations",w:13},B:{n:"Customer relations & sales",w:15},C:{n:"Vehicle systems",w:53},D:{n:"Vehicle identification",w:4},E:{n:"Catalog & information",w:8},F:{n:"Inventory management",w:4},G:{n:"Merchandising",w:3}};
const ORDER=["A","B","C","D","E","F","G"], KEY="asep2:progress", LTR=["A","B","C","D"];
const app=document.getElementById("app");
let S=null, run=null, timer=null;

function fresh(){const a={};ORDER.forEach(k=>a[k]={c:0,n:0});return{v:1,streak:0,last:null,days:[],area:a,seen:{},missed:[],bestExam:null};}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayBefore(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()-n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}

const STORE={
  async get(k){
    if(window.storage&&window.storage.get){const r=await window.storage.get(k);return r?r.value:null;}
    try{return window.localStorage.getItem(k);}catch(e){return null;}
  },
  async set(k,v){
    if(window.storage&&window.storage.set){await window.storage.set(k,v);return;}
    try{window.localStorage.setItem(k,v);}catch(e){}
  }
};
async function load(){
  try{const r=await STORE.get(KEY);S=r?JSON.parse(r):fresh();}
  catch(e){S=fresh();}
  if(!S||!S.v){S=fresh();}
  ORDER.forEach(k=>{if(!S.area[k])S.area[k]={c:0,n:0};});
  S.seen=S.seen||{}; S.missed=S.missed||[]; S.days=S.days||[];
}
async function save(){try{await STORE.set(KEY,JSON.stringify(S));}catch(e){}}

function acc(k){const a=S.area[k];return a.n?Math.round(a.c/a.n*100):null;}
function totals(){let c=0,n=0;ORDER.forEach(k=>{c+=S.area[k].c;n+=S.area[k].n;});return{c,n};}

/* ---------- picking ---------- */
function pick(n,pool){
  const byArea={};ORDER.forEach(k=>byArea[k]=[]);
  pool.forEach(i=>byArea[Q[i].a].push(i));
  const quota={},tot=ORDER.reduce((s,k)=>s+AREA[k].w,0);
  let assigned=0;
  ORDER.forEach(k=>{const q=Math.min(byArea[k].length,Math.floor(n*AREA[k].w/tot));quota[k]=q;assigned+=q;});
  const rank=ORDER.slice().sort((a,b)=>AREA[b].w-AREA[a].w);
  let i=0;while(assigned<n&&i<400){const k=rank[i%rank.length];if(quota[k]<byArea[k].length){quota[k]++;assigned++;}i++;}
  const out=[];
  ORDER.forEach(k=>{
    const list=byArea[k].slice().sort((x,y)=>score(x)-score(y));
    out.push(...list.slice(0,quota[k]));
  });
  for(let j=out.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[out[j],out[r]]=[out[r],out[j]];}
  return out;
}
function score(i){return (S.missed.includes(i)?-8:0)+(S.seen[i]||0)+Math.random();}

/* ---------- screens ---------- */
function home(){
  const t=totals(), overall=t.n?Math.round(t.c/t.n*100):null;
  const weak=ORDER.filter(k=>S.area[k].n>=4).sort((a,b)=>acc(a)-acc(b))[0];
  const week=[];for(let i=6;i>=0;i--)week.push(dayBefore(today(),i));
  const bars=ORDER.map(k=>{
    const a=acc(k), w=AREA[k].w, pctW=Math.max(8,Math.round(w/53*100));
    return `<div class="bp-row">
      <div class="bp-name">${esc(AREA[k].n)}</div>
      <div class="bp-track-wrap"><div class="bp-track" style="width:${pctW}%">
        <div class="bp-fill${a===null?" thin":""}" style="width:${a===null?0:a}%"></div></div></div>
      <div class="bp-pct">${a===null?"\u2014":a+"%"}</div></div>`;}).join("");

  app.innerHTML=`
    <h1>ASE P2 daily drill</h1>
    <p class="sub">Automobile Parts Specialist \u00b7 ${Q.length} questions in the bank</p>

    <div class="panel">
      <div class="streak"><b>${S.streak}</b><span>day${S.streak===1?"":"s"} in a row${S.last===today()?" \u00b7 today is done":""}</span></div>
      <div class="week">${week.map(d=>`<div class="dot${S.days.includes(d)?" on":""}"></div>`).join("")}</div>
    </div>

    <div class="panel">
      <h2>Your accuracy against the real blueprint</h2>
      ${bars}
      <p class="bp-note">Bar width is that area's share of the scored test. Vehicle systems is 53% of your grade${overall!==null?`, and you are at ${overall}% overall across ${t.n} answered`:""}.${weak&&acc(weak)<75?` Weakest right now: ${esc(AREA[weak].n.toLowerCase())}.`:""}</p>
    </div>

    <button class="btn" onclick="start('daily')">Daily 20<small>Weighted like the real test. Missed questions come back first.</small></button>
    <button class="btn ghost" onclick="start('area')">Drill one area<small>Pick a weak spot and hammer it</small></button>
    <button class="btn ghost" ${S.missed.length<4?"disabled":""} onclick="start('miss')">Review misses<small>${S.missed.length} question${S.missed.length===1?"":"s"} waiting${S.missed.length<4?" \u00b7 need at least 4":""}</small></button>
    <button class="btn ghost" onclick="start('exam')">Full mock exam<small>75 questions, 90 minutes${S.bestExam!==null?" \u00b7 best "+S.bestExam+"%":""}</small></button>
    <a class="btn ghost link" href="drills.html">Fresh drills<small>Picture questions and no-calculator math, new every time</small></a>
    <a class="btn ghost link" href="study-guide.html">Study guide<small>Blueprint, content review, and a 102-question practice exam</small></a>
    <a class="btn ghost link" href="podcast/">Listen<small>Five 15-minute audio episodes covering the whole blueprint</small></a>
    <p class="tiny">Progress saves automatically on this device.<br><button class="lnk" onclick="setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');home()">Switch to ${document.documentElement.dataset.theme==="light"?"night":"light"} mode</button></p>`;
}

function areaPicker(){
  app.innerHTML=`<h1>Drill one area</h1><p class="sub">15 questions from a single content area</p>`+
  ORDER.map(k=>{const a=acc(k);return `<button class="btn ghost" onclick="start('area','${k}')">${esc(AREA[k].n)}<small>${AREA[k].w}% of the test${a===null?"":" \u00b7 you're at "+a+"%"}</small></button>`;}).join("")+
  `<button class="btn ghost" onclick="home()">Back</button>`;
}

function start(mode,areaKey){
  if(mode==="area"&&!areaKey){areaPicker();return;}
  let ids, secs=null;
  if(mode==="miss"){ids=S.missed.slice();for(let j=ids.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[ids[j],ids[r]]=[ids[r],ids[j]];}ids=ids.slice(0,20);}
  else if(mode==="area"){const pool=Q.map((q,i)=>i).filter(i=>Q[i].a===areaKey);ids=pool.sort((x,y)=>score(x)-score(y)).slice(0,15);}
  else if(mode==="exam"){ids=pick(75,Q.map((q,i)=>i));secs=90*60;}
  else{ids=pick(20,Q.map((q,i)=>i));}
  run={mode,ids,i:0,right:0,wrong:[],answered:false,area:areaKey,secs,exam:mode==="exam"};
  if(secs){timer=setInterval(tick,1000);}
  question();
}
function tick(){
  if(!run||run.secs===null)return;
  run.secs--;
  const el=document.getElementById("clock");
  if(el){el.textContent=fmt(run.secs);el.className="clock"+(run.secs<300?" low":"");}
  if(run.secs<=0){clearInterval(timer);timer=null;finish();}
}
function fmt(s){const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");}

function question(){
  const q=Q[run.ids[run.i]];
  // run.ord = display order of the answers. Shuffled so position can't be memorized,
  // except "A only / B only / Both / Neither", which keeps the fixed order the real test uses.
  run.ord=q.o.map((_,i)=>i);
  if(q.o[0]!=="A only")for(let j=run.ord.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[run.ord[j],run.ord[r]]=[run.ord[r],run.ord[j]];}
  app.innerHTML=`
    <div class="bar"><i style="width:${run.i/run.ids.length*100}%"></i></div>
    <div class="meta"><span>${run.i+1} of ${run.ids.length} \u00b7 ${esc(q.t)}</span>
    <span>${run.exam?`<span id="clock" class="clock">${fmt(run.secs)}</span>`:`${run.right} right`}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div id="opts">${run.ord.map((oi,j)=>`<button class="opt" onclick="answer(${oi})"><span class="ltr">${LTR[j]}</span>${esc(q.o[oi])}</button>`).join("")}</div>
    <div id="fb"></div>`;
  window.scrollTo(0,0);
}

function answer(j){
  if(run.answered)return; run.answered=true;
  const idx=run.ids[run.i], q=Q[idx], ok=j===q.c;
  S.seen[idx]=(S.seen[idx]||0)+1;
  S.area[q.a].n++; if(ok)S.area[q.a].c++;
  if(ok){run.right++; const m=S.missed.indexOf(idx); if(m>-1)S.missed.splice(m,1);}
  else{run.wrong.push(idx); if(!S.missed.includes(idx))S.missed.push(idx);}
  const btns=document.querySelectorAll("#opts .opt");
  btns.forEach((b,k)=>{const oi=run.ord[k];b.disabled=true;if(oi===q.c)b.classList.add("correct");else if(oi===j)b.classList.add("wrong");});
  document.getElementById("fb").innerHTML=
    `<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct":"Correct answer: "+LTR[run.ord.indexOf(q.c)]}</b>${esc(q.e)}</div>
     <button class="btn" onclick="next()">${run.i+1===run.ids.length?"See results":"Next question"}</button>`;
  save();
}
function next(){run.i++;run.answered=false;if(run.i>=run.ids.length){finish();}else{question();}}

async function finish(){
  if(timer){clearInterval(timer);timer=null;}
  const n=run.i+(run.answered?1:0)||run.ids.length, pct=Math.round(run.right/run.ids.length*100);
  if(run.mode==="daily"||run.mode==="exam"){
    const d=today();
    if(S.last!==d){
      S.streak=(S.last===dayBefore(d,1))?S.streak+1:1;
      S.last=d; S.days.push(d); S.days=S.days.slice(-30);
    }
  }
  if(run.exam&&(S.bestExam===null||pct>S.bestExam))S.bestExam=pct;
  await save();
  const verdict = pct>=85?"Ready. Keep this up and go sit the test."
    : pct>=70?"Passing range, but thin. Re-read the areas you missed more than once."
    : "Not there yet. Go back to the review notes before you book a date.";
  const byArea={};run.ids.forEach((id,k)=>{const a=Q[id].a;byArea[a]=byArea[a]||{c:0,n:0};byArea[a].n++;if(!run.wrong.includes(id))byArea[a].c++;});
  app.innerHTML=`
    <h1>${run.exam?"Mock exam":"Session"} results</h1>
    <div class="panel">
      <div class="score">${pct}%<span> \u00b7 ${run.right} of ${run.ids.length}</span></div>
      <p class="verdict">${verdict}</p>
    </div>
    <div class="panel"><h2>By content area</h2>
      ${Object.keys(byArea).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).map(k=>
        `<div class="bp-row"><div class="bp-name">${esc(AREA[k].n)}</div>
         <div class="bp-track-wrap"><div class="bp-track"><div class="bp-fill" style="width:${Math.round(byArea[k].c/byArea[k].n*100)}%"></div></div></div>
         <div class="bp-pct">${byArea[k].c}/${byArea[k].n}</div></div>`).join("")}
    </div>
    ${run.wrong.length?`<div class="panel"><h2>Worth re-reading</h2>
      ${run.wrong.map(id=>`<div class="miss"><em>${esc(AREA[Q[id].a].n)} \u00b7 ${esc(Q[id].t)}</em>${esc(Q[id].q)}<br><b>Answer:</b> ${esc(Q[id].o[Q[id].c])}</div>`).join("")}
      </div>`:""}
    <button class="btn" onclick="home()">Done</button>
    ${run.wrong.length>=4?`<button class="btn ghost" onclick="start('miss')">Retry the ones you missed</button>`:""}`;
  window.scrollTo(0,0);
}

load().then(home).catch(()=>{S=fresh();home();});
</script>
